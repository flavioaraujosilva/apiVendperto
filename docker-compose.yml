version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql://vendperto:nxq8n8m0qh7lnrqz@5.161.218.248:5432/vendperto
    volumes:
      - logs_data:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  logs_data: 